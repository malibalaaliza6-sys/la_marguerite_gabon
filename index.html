<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Marguerite - Naturel. Street. Élégant.</title>
  <style>
    :root {
      --marron-fonce: #5D4037;
      --marron-clair: #A1887F;
      --beige: #EFEBE9;
      --doré: #D4AF37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: var(--beige); color: #333; }
    
    header { background: var(--marron-fonce); color: white; padding: 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: auto; }
    nav h1 { font-size: 26px; letter-spacing: 2px; }
    nav ul { list-style: none; display: flex; gap: 20px; }
    nav a { color: white; text-decoration: none; font-weight: 500; }
    
    .hero { 
      background: linear-gradient(rgba(93,64,55,0.6), rgba(93,64,55,0.6)), url('karite.jpg') center/cover; 
      height: 450px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center;
      color: white; 
    }
    .hero h2 { font-size: 42px; margin-bottom: 10px; }
    .hero p { font-size: 18px; }
    .btn-hero { 
      background: var(--doré); 
      color: var(--marron-fonce); 
      padding: 14px 28px; 
      text-decoration: none; 
      border-radius: 8px; 
      font-weight: bold;
      display: inline-block;
      margin-top: 20px;
    }
    
    .categories { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
    .categories h2 { text-align: center; color: var(--marron-fonce); margin-bottom: 40px; font-size: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
    .card { 
      background: white; 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 4px 15px rgba(93,64,55,0.1);
      transition: 0.3s;
    }
    .card:hover { transform: translateY(-8px); }
    .card img { width: 100%; height: 240px; object-fit: cover; }
    .card h3 { padding: 15px; color: var(--marron-fonce); }
    .btn { 
      display: block; 
      background: var(--marron-clair); 
      color: white; 
      text-align: center; 
      padding: 12px; 
      text-decoration: none; 
      font-weight: bold;
    }
    
    footer { background: var(--marron-fonce); color: white; text-align: center
