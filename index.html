<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Marguerite</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap');

        :root {
            --marron-fonce: #2b1812;
            --marron-clair: #8a6248;
            --beige: #e8d5b5;
            --dore: #c9a45c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--marron-fonce);
            color: var(--dore);
            font-family: "Worthy", "Libre Baskerville", serif;
            font-size: 12px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 35px 20px 20px;
            border-bottom: 1px solid var(--marron-clair);
        }

        .logo {
            font-family: "Cochin", Georgia, serif;
            color: var(--beige);
            font-size: clamp(28px, 9vw, 52px);
            letter-spacing: 4px;
            font-weight: normal;
        }

        .slogan {
            color: var(--dore);
            margin-top: 8px;
            letter-spacing: 2px;
            font-size: 12px;
        }

        /* PRODUIT PRINCIPAL */

        .hero {
            width: 100%;
            padding: 35px 20px;
            text-align: center;
        }

        .product-image {
            width: min(80vw, 360px);
            height: min(80vw, 360px);
            margin: auto;
            border-radius: 20px;
            overflow: hidden;
            background: var(--marron-clair);
            box-shadow: 0 15px 40px rgba(0,0,0,0.45);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-title {
            margin-top: 25px;
            color: var(--beige);
            font-family: "Cochin", Georgia, serif;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .product-description {
            max-width: 500px;
            margin: 12px auto;
            line-height: 1.8;
            color: var(--dore);
            font-size: 12px;
        }

        /* SECTION BEAUTÉ */

        .beauty {
            background: var(--marron-clair);
            padding: 40px 20px;
            margin-top: 10px;
        }

        .beauty h2 {
            text-align: center;
            font-family: "Cochin", Georgia, serif;
            color: var(--beige);
            font-size: 27px;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: var(--marron-fonce);
            border: 1px solid rgba(201,164,92,0.4);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
        }

        .card h3 {
            color: var(--beige);
            font-size: 12px;
            margin-top: 12px;
            letter-spacing: 1px;
            font-weight: normal;
        }

        /* CONTACT */

        .contact {
            text-align: center;
            padding: 40px 20px;
        }

        .contact h2 {
            font-family: "Cochin", Georgia, serif;
            color: var(--beige);
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-block;
            padding: 13px 20px;
            border: 1px solid var(--dore);
            border-radius: 30px;
            color: var(--dore);
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }

        .button:hover {
            background: var(--dore);
            color: var(--marron-fonce);
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--marron-clair);
            color: var(--dore);
            font-size: 10px;
        }

        /* TÉLÉPHONE */

        @media (max-width: 480px) {

            header {
                padding-top: 25px;
            }

            .logo {
                font-size: 30px;
                letter-spacing: 3px;
            }

            .hero {
                padding: 25px 15px;
            }

            .product-image {
                width: 85vw;
                height: 85vw;
            }

            .products {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .beauty {
                padding: 30px 12px;
            }

            .contact {
                padding: 30px 15px;
            }

            .button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">LA MARGUERITE</div>
        <div class="slogan">BEAUTÉ • ÉLÉGANCE • NATURE</div>
    </header>


    <main>

        <!-- PRODUIT MIS EN AVANT -->

        <section class="hero">

            <div class="product-image">
                <img
                    src="images/beurre-karite-principal.jpg"
                    alt="Pot noir de beurre de karité">
            </div>

            <h1 class="product-title">
                BEURRE DE KARITÉ
            </h1>

            <p class="product-description">
                Découvrez notre univers beauté autour du beurre de karité,
                présenté avec élégance par La Marguerite.
            </p>

        </section>


        <!-- BEAUTÉ -->

        <section class="beauty">

            <h2>BEAUTÉ</h2>

            <div class="products">

                <div class="card">
                    <img
                        src="images/beurre-karite-1.jpg"
                        alt="Beurre de karité">
                    <h3>BEURRE DE KARITÉ</h3>
                </div>

                <div class="card">
                    <img
                        src="images/beurre-karite-2.jpg"
                        alt="Beurre de karité naturel">
                    <h3>BEAUTÉ NATURELLE</h3>
                </div>

                <div class="card">
                    <img
                        src="images/beurre-karite-3.jpg"
                        alt="Beurre de karité">
                    <h3>SOIN AU KARITÉ</h3>
                </div>

            </div>

        </section>


        <!-- CONTACT -->

        <section class="contact">

            <h2>NOUS CONTACTER</h2>

            <div class="buttons">

                <a
                    class="button"
                    href="https://wa.me/24176412211"
                    target="_blank">
                    WHATSAPP
                </a>

                <a
                    class="button"
                    href="mailto:malibalaaliza6@gmail.com">
                    E-MAIL
                </a>

            </div>

        </section>

    </main>


    <footer>
        © 2026 LA MARGUERITE — Tous droits réservés
    </footer>

</body>
</html>
