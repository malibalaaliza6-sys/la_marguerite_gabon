<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nos Produits - La Marguerite</title>
  <style>
    :root {
      --marron-fonce: #4E342E;
      --marron-clair: #8D6E63;
      --beige: #F5F1EB;
      --doré: #C9A961;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: var(--beige); color: #3E2723; }
    
    header { background: var(--marron-fonce); color: white; padding: 18px 20px; position: sticky; top: 0; }
    nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: auto; }
    nav h1 { font-size: 24px; letter-spacing: 3px; }
    nav ul { list-style: none; display: flex; gap: 25px; }
    nav a { color: white; text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--doré); }
    
    .page-title { text-align: center; padding: 50px 20px 20px; }
    .page-title h2 { font-size: 36px; color: var(--marron-fonce); }
    .page-title p { color: var(--marron-clair); margin-top: 10px; }
    
    .grid { 
      max-width: 1200px; 
      margin: 40px auto; 
      padding: 0 20px; 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 35px; 
    }
    .card { 
      background: white; 
      border-radius: 15px; 
      overflow: hidden; 
      box-shadow: 0 5px 20px rgba(78,52,46,0.15);
      transition: 0.3s;
    }
    .card:hover { transform: translateY(-10px); }
    .card img { width: 100%; height: 280px; object-fit: cover; }
    .card-content { padding: 20px; text-align: center; }
    .card h3 { color: var(--marron-fonce); margin-bottom: 8px; font-size: 18px; }
    .prix { color: var(--marron-clair); font-weight: bold; font-size: 20px; margin-bottom: 15px; }
    .btn-whatsapp { 
      display: block; 
      background: var(--marron-clair); 
      color: white; 
      text-align: center; 
      padding: 12px; 
      text-decoration: none; 
      font-weight: bold;
      border-radius: 8px;
    }
    .btn-whatsapp:hover { background: var(--marron-fonce); }
    
    footer { background: var(--marron-fonce); color: white; text-align: center; padding: 40px 20px; margin-top: 70px; }
  </style>
</head>
